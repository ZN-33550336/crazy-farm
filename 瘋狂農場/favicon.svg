<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1a38" />
      <stop offset="70%" stop-color="#050a18" />
      <stop offset="100%" stop-color="#02040b" />
    </radialGradient>
    <linearGradient id="neonCyanPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f6ff" />
      <stop offset="50%" stop-color="#bd00ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <linearGradient id="crystalTop" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#7df9ff" />
      <stop offset="100%" stop-color="#00c8ff" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f6ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ff007f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f6ff" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b050" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圓角方形底座 -->
  <rect width="512" height="512" rx="116" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#00f6ff" stroke-width="4" stroke-opacity="0.45" />

  <!-- 背景量子微光網格點 -->
  <circle cx="256" cy="270" r="160" fill="#00f6ff" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="256" cy="270" r="90" fill="#ff007f" fill-opacity="0.18" filter="url(#glow)" />

  <!-- 軌道環後端 (在果實後面) -->
  <g transform="rotate(-26 256 280)">
    <ellipse cx="256" cy="280" rx="180" ry="46" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-dasharray="240 300" stroke-linecap="round" filter="url(#subtleGlow)" />
  </g>

  <!-- 頂部量子晶葉 (Sprout/Leaf) -->
  <g filter="url(#subtleGlow)">
    <!-- 葉柄 -->
    <path d="M256 160 C254 135 240 115 220 102" fill="none" stroke="#00ff88" stroke-width="7" stroke-linecap="round" />
    <!-- 嫩葉 -->
    <path d="M256 150 C270 120 310 115 324 132 C318 162 284 172 256 150 Z" fill="url(#leafGrad)" />
    <!-- 葉脈光線 -->
    <path d="M262 148 Q286 138 312 133" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- 量子晶核果實本體 (多面切角水晶蘋果造型) -->
  <g filter="url(#subtleGlow)">
    <!-- 果實外輪廓與底色 -->
    <path d="M256 156 C200 156 140 188 140 260 C140 334 196 396 242 414 C252 418 260 418 270 414 C316 396 372 334 372 260 C372 188 312 156 256 156 Z" fill="url(#neonCyanPink)" />

    <!-- 內部水晶切面 1：頂部左切面 -->
    <polygon points="256,156 195,190 220,245 256,220" fill="url(#crystalTop)" opacity="0.65" />
    <!-- 內部水晶切面 2：頂部右切面 -->
    <polygon points="256,156 317,190 292,245 256,220" fill="#ffffff" opacity="0.5" />
    <!-- 內部水晶切面 3：中央主菱面 -->
    <polygon points="256,220 292,245 272,325 240,325 220,245" fill="#00f6ff" opacity="0.75" />
    <!-- 內部水晶切面 4：左側腹切面 -->
    <polygon points="195,190 148,255 178,328 220,245" fill="#094b8a" opacity="0.7" />
    <!-- 內部水晶切面 5：右側腹切面 -->
    <polygon points="317,190 364,255 334,328 292,245" fill="#bd00ff" opacity="0.6" />
    <!-- 內部水晶切面 6：底端左切面 -->
    <polygon points="220,245 178,328 244,410 240,325" fill="#ff007f" opacity="0.7" />
    <!-- 內部水晶切面 7：底端右切面 -->
    <polygon points="292,245 334,328 268,410 272,325" fill="#ff1493" opacity="0.75" />
    <!-- 內部水晶切面 8：正底尖切面 -->
    <polygon points="240,325 272,325 268,410 244,410" fill="#ffe600" opacity="0.7" />

    <!-- 水晶稜線描邊 (強化高科技晶體感) -->
    <path d="M256 156 L256 220 M256 220 L195 190 M256 220 L317 190 M256 220 L220 245 M256 220 L292 245 M220 245 L240 325 M292 245 L272 325 M240 325 L272 325 M240 325 L244 410 M272 325 L268 410 M220 245 L178 328 M292 245 L334 328 M178 328 L244 410 M334 328 L268 410 M195 190 L220 245 M317 190 L292 245" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.85" />
    <path d="M256 156 C200 156 140 188 140 260 C140 334 196 396 242 414 C252 418 260 418 270 414 C316 396 372 334 372 260 C372 188 312 156 256 156 Z" fill="none" stroke="#00f6ff" stroke-width="4.5" stroke-opacity="0.9" />
  </g>

  <!-- 軌道環前端 (穿過果實前面，形成立體環繞) -->
  <g transform="rotate(-26 256 280)" filter="url(#glow)">
    <ellipse cx="256" cy="280" rx="180" ry="46" fill="none" stroke="url(#ringGrad)" stroke-width="9" stroke-dasharray="0 260 250 50" stroke-linecap="round" />
    <!-- 軌道行星微粒 -->
    <circle cx="395" cy="265" r="9" fill="#00f6ff" />
    <circle cx="395" cy="265" r="4" fill="#ffffff" />
    <circle cx="115" cy="295" r="7" fill="#ff007f" />
    <circle cx="115" cy="295" r="3" fill="#ffffff" />
  </g>

  <!-- 閃光亮點 -->
  <g fill="#ffffff">
    <circle cx="218" cy="210" r="5" opacity="0.9" filter="url(#subtleGlow)" />
    <polygon points="218,202 221,210 229,210 223,214 225,222 218,217 211,222 213,214 207,210 215,210" opacity="0.8" />
    <circle cx="305" cy="315" r="4" opacity="0.85" filter="url(#subtleGlow)" />
  </g>
</svg>
